[project]
name = "home-assistant-ct-tv-program-research"
version = "0.1.0"
description = "Research tooling for the Czech Television programme export"
readme = "README.md"
requires-python = ">=3.14.4,<3.15"
dependencies = ["python-dotenv>=1.1.1"]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pre-commit>=4.6,<5",
    "pyright>=1.1.404,<2",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.16,<0.17",
]

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=scripts",
    "--cov-report=term-missing",
    "--cov-fail-under=95",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"

[tool.ruff.lint]
ignore = ["D100", "D104"]
select = ["ANN", "B", "D", "E4", "E7", "E9", "F", "I", "N", "RUF", "SIM", "UP"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.pyright]
exclude = [".venv", "**/node_modules", "**/__pycache__", "**/.*"]
include = ["scripts", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venv = ".venv"
venvPath = "."
reportMissingTypeStubs = false
reportPrivateUsage = false
reportTypedDictNotRequiredAccess = false
reportUnknownMemberType = false
